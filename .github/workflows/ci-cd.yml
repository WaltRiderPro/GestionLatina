name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # El flujo de CD se activa principalmente al consolidar en main
  pull_request:
    branches: [ "main" ]

jobs:
  # =======================================================
  # FASE 1: VERIFICACIÓN E INTEGRIDAD DE ARCHIVOS (CI)
  # =======================================================
  check-files:
    name: Check Repository Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Verify Project Structure
      run: |
        echo "Verificando estructura de Spring Boot y Thymeleaf..."
        test -f pom.xml && echo "pom.xml detectado correctamente."

  # =======================================================
  # FASE 2: COMPILACIÓN Y VALIDACIÓN (CI)
  # =======================================================
  validate-backend:
    name: Validate & Compile Architecture
    runs-on: ubuntu-latest
    needs: check-files
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile Application with Maven
      run: mvn clean compile

  # =======================================================
  # FASE 3: EJECUCIÓN DE PRUEBAS Y REPORTES (CI)
  # =======================================================
  run-reports:
    name: Run Automated Tests & Generate Reports
    runs-on: ubuntu-latest
    needs: validate-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Polleria_Latina_DB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Execute Application Tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: Polleria_Latina_DB
        DB_USERNAME: postgres
        DB_PASSWORD: 123456
        SERVER_PORT: 8080
        JWT_SECRET: tu_secreto_super_seguro_aqui
        MAIL_USERNAME: tu_correo@gmail.com
        MAIL_PASSWORD: las_16_letras_sin_espacios
      run: mvn test

  # =======================================================
  # FASE 4: EMPAQUETADO MIXTO (CI)
  # =======================================================
  package-application:
    name: Package Unified Monolith (.JAR)
    runs-on: ubuntu-latest
    needs: run-reports
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build Final Package (Skip Tests)
      run: mvn package -DskipTests

    # CRUCIAL PARA CD: Guarda el archivo .jar generado para que el siguiente Job pueda usarlo
    - name: Upload Build Artifact for Deployment
      uses: actions/upload-artifact@v4
      with:
        name: polleria-latina-artifact
        path: target/*.jar
        retention-days: 1

  # =======================================================
  # FASE 5: ENTREGA CONTINUA / DESPLIEGUE (CD)
  # =======================================================
  deploy-application:
    name: Continuous Delivery & Release
    runs-on: ubuntu-latest
    needs: package-application
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Solo se ejecuta al hacer push definitivo en main
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: polleria-latina-artifact
        path: deployment/

    - name: Simulate Cloud Deployment Integration
      run: |
        echo "Iniciando proceso de Entrega Continua (CD)..."
        echo "Artefacto listo para distribución en entorno de producción."
        ls -la deployment/
        echo "Despliegue simulado exitosamente. El sistema está listo para operar."