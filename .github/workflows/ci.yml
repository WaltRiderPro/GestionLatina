name: Java Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # =======================================================
  # FASE 1: VERIFICACIÓN E INTEGRIDAD DE ARCHIVOS
  # =======================================================
  check-files:
    name: Check Repository Files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Verify Project Structure
      run: |
        echo "Verificando estructura de Spring Boot y Thymeleaf..."
        ls -la
        test -f pom.xml && echo "pom.xml detectado correctamente."

  # =======================================================
  # FASE 2: COMPILACIÓN Y VALIDACIÓN DEL PROYECTO
  # =======================================================
  validate-backend:
    name: Validate & Compile Architecture
    runs-on: ubuntu-latest
    needs: check-files
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile Application with Maven
      run: mvn clean compile

  # =======================================================
  # FASE 3: EJECUCIÓN DE PRUEBAS AUTOMATIZADAS Y REPORTES
  # =======================================================
  run-reports:
    name: Run Automated Tests & Generate Reports
    runs-on: ubuntu-latest
    needs: validate-backend
    
    # Levanta la base de datos idéntica a tu .env para el test de contexto
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Polleria_Latina_DB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Execute Application Tests
      env:
        # Inyección exacta de tu .env para que Spring Boot levante sin errores
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: Polleria_Latina_DB
        DB_USERNAME: postgres
        DB_PASSWORD: 123456
        SERVER_PORT: 8080
        JWT_SECRET: tu_secreto_super_seguro_aqui
        MAIL_USERNAME: tu_correo@gmail.com
        MAIL_PASSWORD: las_16_letras_sin_espacios
      run: mvn test

  # =======================================================
  # FASE 4: EMPAQUETADO MIXTO (BACKEND + THYMELEAF)
  # =======================================================
  package-application:
    name: Package Unified Monolith (.JAR)
    runs-on: ubuntu-latest
    needs: run-reports
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build Final Package (Skip Tests)
      run: mvn package -DskipTests