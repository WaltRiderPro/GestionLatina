name: Integración Continuas Pollería Latina

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ---------------------------------------------------
  # CAJA 1: COMPILACIÓN (Build)
  # ---------------------------------------------------
  build:
    name: Compilar Proyecto
    runs-on: ubuntu-latest
    steps:
    - name: Copiar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Dar Permisos al Maven Wrapper
      run: chmod +x ./mvnw

    - name: Compilar Código Base
      run: ./mvnw clean compile -DskipTests

  # ---------------------------------------------------
  # CAJA 2: PRUEBAS UNITARIAS (Test) -> Depende de la Caja 1
  # ---------------------------------------------------
  test:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-latest
    needs: build # <-- Esto dibuja la flecha desde la caja de compilación
    
    # Configuración de base de datos Postgres temporal para los tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: Polleria_Latina_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Copiar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Dar Permisos al Maven Wrapper
      run: chmod +x ./mvnw

    - name: Correr Pruebas contra Postgres
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: Polleria_Latina_DB
        DB_USERNAME: postgres
        DB_PASSWORD: 123456
        JWT_SECRET: secreto_generico_para_pasar_las_pruebas_en_ci
        MAIL_USERNAME: test@test.com
        MAIL_PASSWORD: test
      run: ./mvnw test

  # ---------------------------------------------------
  # CAJA 3: EMPAQUETADO (Package) -> Depende de la Caja 2
  # ---------------------------------------------------
  package:
    name: Generar Artefacto .JAR
    runs-on: ubuntu-latest
    needs: test # <-- Esto dibuja la flecha desde la caja de pruebas
    steps:
    - name: Copiar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Dar Permisos al Maven Wrapper
      run: chmod +x ./mvnw

    - name: Construir archivo .JAR Final
      run: ./mvnw package -DskipTests