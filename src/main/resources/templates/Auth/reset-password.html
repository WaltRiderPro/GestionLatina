<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#E31818" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear Nueva Contraseña | Pollería Latina</title>

    <link rel="icon" type="image/png" th:href="@{/assets/images/favicon.png}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/assets/libs/flaticon/css/all/all.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}" />

    <style>
      .password-wrapper .form-control.is-valid,
      .password-wrapper .form-control.is-invalid {
        background-image: none !important;
        padding-right: 2.5rem !important;
      }
    </style>
  </head>

  <body>
    <div class="page-layout">
      <div class="auth-wrapper min-vh-100 px-2">
        <div class="row g-0 min-vh-100">
          <div
            class="col-xl-5 col-lg-6 ms-auto px-sm-4 align-self-center py-4 d-none d-lg-block"
          >
            <img
              th:src="@{/assets/images/auth/vector2.svg}"
              alt="Ilustración Pollería"
              class="img-fluid"
            />
          </div>

          <div class="col-xl-5 col-lg-6 ms-auto px-sm-4 align-self-center py-4">
            <div
              class="card card-body p-4 p-sm-5 maxw-450px m-auto rounded-4 shadow-sm border-0"
            >
              <div class="mb-4 text-center">
                <a th:href="@{/}" aria-label="Polleria Latina logo">
                  <img
                    th:src="@{/assets/images/logo.png}"
                    alt="Pollería Latina logo"
                    style="max-width: 160px; height: auto"
                  />
                </a>
              </div>

              <div class="text-center mb-4">
                <h5 class="mb-1 fw-bold">Crea tu nueva contraseña</h5>
                <p class="text-muted fs-7">
                  Escribe una contraseña segura para recuperar tu acceso al
                  sistema.
                </p>
              </div>

              <div
                th:if="${error}"
                class="alert alert-danger alert-dismissible fade show text-center shadow-sm fs-7"
                role="alert"
              >
                <i class="fi fi-rr-triangle-warning me-1"></i>
                <span th:text="${error}"></span>
                <button
                  type="button"
                  class="btn-close shadow-none"
                  data-bs-dismiss="alert"
                  aria-label="Close"
                ></button>
              </div>

              <form
                th:action="@{/reset-password}"
                method="POST"
                id="resetForm"
                novalidate
              >
                <input type="hidden" name="token" th:value="${token}" />

                <div class="mb-4">
                  <label class="form-label fw-semibold mb-0" for="password"
                    >Nueva Contraseña <span class="text-danger">*</span></label
                  >

                  <div class="password-wrapper position-relative mt-2">
                    <input
                      type="password"
                      id="password"
                      name="password"
                      class="form-control bg-light border-0 password-input"
                      placeholder="••••••••"
                      required
                    />
                    <button
                      type="button"
                      id="btnTogglePass"
                      class="position-absolute border-0 bg-transparent p-0"
                      style="
                        right: 15px;
                        top: 50%;
                        transform: translateY(-50%);
                        z-index: 100;
                      "
                      title="Mostrar contraseña"
                    >
                      <i
                        class="fi fi-rr-eye-crossed text-muted fs-6"
                        id="iconPass"
                      ></i>
                    </button>
                  </div>

                  <ul class="list-unstyled mt-3 mb-0 fs-7" id="password-rules">
                    <li id="rule-length" class="text-muted mb-1">
                      <i class="fi fi-rr-cross-circle me-1"></i> Mínimo 8
                      caracteres
                    </li>
                    <li id="rule-upper" class="text-muted mb-1">
                      <i class="fi fi-rr-cross-circle me-1"></i> Al menos una
                      letra mayúscula
                    </li>
                    <li id="rule-number" class="text-muted mb-1">
                      <i class="fi fi-rr-cross-circle me-1"></i> Al menos un
                      número
                    </li>
                    <li id="rule-special" class="text-muted">
                      <i class="fi fi-rr-cross-circle me-1"></i> Un carácter
                      especial (@$!%*?&)
                    </li>
                  </ul>
                </div>

                <div class="clearfix mt-5">
                  <button
                    type="submit"
                    class="btn btn-primary waves-effect waves-light w-100 mb-3 py-2 fw-bold"
                    id="btnSubmit"
                  >
                    <i class="fi fi-rr-disk me-2"></i> Guardar Nueva Contraseña
                  </button>
                  <div class="text-center">
                    <a
                      th:href="@{/login}"
                      class="text-muted text-decoration-none fs-7 fw-semibold"
                      ><i class="fi fi-rr-cross-circle me-1"></i> Cancelar y
                      salir</a
                    >
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/assets/libs/global/global.min.js}"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const btnTogglePass = document.getElementById("btnTogglePass");
        const passwordInput = document.getElementById("password");
        const iconPass = document.getElementById("iconPass");

        if (btnTogglePass && passwordInput) {
          btnTogglePass.addEventListener("click", function (e) {
            e.preventDefault();
            if (passwordInput.type === "password") {
              passwordInput.type = "text";
              iconPass.classList.remove("fi-rr-eye-crossed");
              iconPass.classList.add("fi-rr-eye", "text-primary");
            } else {
              passwordInput.type = "password";
              iconPass.classList.remove("fi-rr-eye", "text-primary");
              iconPass.classList.add("fi-rr-eye-crossed");
            }
          });
        }

        const form = document.getElementById("resetForm");

        function validarCampo(input, condicion) {
          if (condicion) {
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");
          } else {
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");
          }
        }

        function actualizarRegla(id, cumple) {
          const el = document.getElementById(id);
          const icon = el.querySelector("i");
          if (cumple) {
            el.classList.remove("text-muted");
            el.classList.add("text-success", "fw-medium");
            icon.className = "fi fi-rr-check-circle me-1 text-success";
          } else {
            el.classList.remove("text-success", "fw-medium");
            el.classList.add("text-muted");
            icon.className = "fi fi-rr-cross-circle me-1";
          }
        }

        if (passwordInput) {
          passwordInput.addEventListener("input", function () {
            const val = this.value;
            const rLength = val.length >= 8;
            const rUpper = /[A-Z]/.test(val);
            const rNum = /[0-9]/.test(val);
            const rSpec = /[@$!%*?&]/.test(val);

            actualizarRegla("rule-length", rLength);
            actualizarRegla("rule-upper", rUpper);
            actualizarRegla("rule-number", rNum);
            actualizarRegla("rule-special", rSpec);

            validarCampo(this, rLength && rUpper && rNum && rSpec);
          });
        }

        form.addEventListener(
          "submit",
          function (event) {
            const val = passwordInput.value;
            const pwdValid =
              val.length >= 8 &&
              /[A-Z]/.test(val) &&
              /[0-9]/.test(val) &&
              /[@$!%*?&]/.test(val);

            if (!pwdValid) validarCampo(passwordInput, false);

            if (!form.checkValidity() || !pwdValid) {
              event.preventDefault();
              event.stopPropagation();
            }
            form.classList.add("was-validated");
          },
          false,
        );
      });
    </script>
  </body>
</html>
