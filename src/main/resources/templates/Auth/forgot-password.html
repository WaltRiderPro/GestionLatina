<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#5955D1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar Contraseña | FitnessGym</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/favicon.png}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/assets/libs/flaticon/css/all/all.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}" />
  </head>

  <body>
    <div class="page-layout">
      <div class="auth-wrapper min-vh-100 px-2">
        <div class="row g-0 min-vh-100">
          <div
            class="col-xl-5 col-lg-6 ms-auto px-sm-4 align-self-center py-4 d-none d-lg-block"
          >
            <img
              th:src="@{/assets/images/auth/vector2.svg}"
              alt=""
              class="img-fluid"
            />
          </div>

          <div class="col-xl-5 col-lg-6 ms-auto px-sm-4 align-self-center py-4">
            <div class="card card-body p-4 p-sm-5 maxw-450px m-auto rounded-4">
              <div class="mb-4 text-center">
                <a th:href="@{/}" aria-label="FitnessGym logo">
                  <img
                    class="visible-light"
                    th:src="@{/assets/images/logo.svg}"
                    alt="FitnessGym logo"
                  />
                </a>
              </div>

              <div class="text-center mb-4">
                <h5 class="mb-1">Recuperar Contraseña</h5>
                <p class="text-muted fs-7">
                  Por seguridad, valida tu identidad ingresando los siguientes
                  datos asociados a tu cuenta.
                </p>
              </div>

              <div
                th:if="${error}"
                class="alert alert-danger alert-dismissible fade show text-center shadow-sm fs-7"
                role="alert"
              >
                <i class="fi fi-rr-triangle-warning me-1"></i>
                <span th:text="${error}"></span>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                  aria-label="Close"
                ></button>
              </div>

              <form th:action="@{/forgot-password}" method="POST">
                <div class="mb-3">
                  <label class="form-label" for="username">Usuario</label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label" for="dni">DNI</label>
                  <input
                    type="text"
                    class="form-control"
                    id="dni"
                    name="dni"
                    placeholder="Ingresa tu DNI de 8 dígitos"
                    maxlength="8"
                    pattern="[0-9]{8}"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label" for="email"
                    >Correo Electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="ejemplo@fitnessgym.com"
                    required
                  />
                </div>

                <div class="clearfix mt-4">
                  <button
                    type="submit"
                    class="btn btn-primary waves-effect waves-light w-100 mb-3"
                  >
                    <i class="fi fi-rr-envelope me-2"></i> Enviar Enlace de
                    Recuperación
                  </button>
                  <div class="text-center">
                    <a
                      th:href="@{/login}"
                      class="text-muted text-decoration-none fs-7"
                      ><i class="fi fi-rr-arrow-left me-1"></i> Volver al
                      Login</a
                    >
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script th:src="@{/assets/libs/global/global.min.js}"></script>
  </body>
</html>
