<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/head :: head}"></th:block>
    <title th:text="${titulo}">Toma de Pedido | Pollería Latina</title>
    <style>
        .menu-item-card {
            transition: all 0.2s ease-in-out;
        }
        .menu-item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.1) !important;
        }
        .sticky-cart {
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div class="page-layout">
        <th:block th:replace="~{components/header :: header}"></th:block>
        <th:block th:replace="~{components/sidebar :: sidebar}"></th:block>

        <main class="app-wrapper">
            <div class="container-fluid">
                
                <div class="d-flex justify-content-between align-items-center mb-4 mt-2 border-bottom pb-3">
                    <div>
                        <h1 class="h3 mb-0 fw-bold" th:text="'Comanda Digital - Mesa #' + ${mesa.numero}">Mesa #</h1>
                        <p class="text-muted mb-0" th:text="'Capacidad máxima: ' + ${mesa.capacidadPersonas} + ' personas'"></p>
                    </div>
                    <div>
                        <a th:href="@{/mesas}" class="btn btn-outline-danger btn-sm font-w600">
                            <i class="fa fa-arrow-left me-1"></i> Cancelar y Regresar
                        </a>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-7">
                        
                        <ul class="nav nav-pills mb-3 bg-light p-1 rounded" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active font-w600" id="cat-tab-all" data-bs-toggle="pill" data-bs-target="#cat-all" type="button" role="tab">Todos</button>
                            </li>
                            <li class="nav-item" th:each="c : ${categorias}" role="presentation">
                                <button class="nav-link font-w600" th:id="'cat-tab-' + ${c.id}" data-bs-toggle="pill" th:data-bs-target="'#cat-' + ${c.id}" type="button" role="tab" th:text="${c.nombre}"></button>
                            </li>
                        </ul>

                        <div class="tab-content" id="pills-tabContent">
                            
                            <div class="tab-pane fade show active" id="cat-all" role="tabpanel">
                                <div class="row">
                                    <div class="col-md-6 mb-3" th:each="p : ${productos}">
                                        <div class="card shadow-sm border-0 menu-item-card h-100">
                                            <div class="card-body p-3 d-flex align-items-center">
                                                <img th:src="${p.getListaImagenes() != null && !p.getListaImagenes().isEmpty()} ? @{'/uploads/productos/' + ${p.getListaImagenes().get(0)}} : @{/assets/images/product/1.webp}" 
                                                     class="rounded me-3" width="70" height="70" style="object-fit: cover;" />
                                                <div class="w-100">
                                                    <h6 class="fw-bold mb-0" th:text="${p.nombre}">Nombre</h6>
                                                    <small class="text-muted d-block" th:text="${p.presentacion != null ? p.presentacion.nombre : 'Porción'}"></small>
                                                    <div class="d-flex justify-content-between align-items-center mt-2">
                                                        <span class="fw-bold text-primary" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></span>
                                                        <button type="button" class="btn btn-primary btn-sm px-3"
                                                                th:data-id="${p.id}" th:data-nombre="${p.nombre}" th:data-precio="${p.precio}"
                                                                onclick="agregarAlCarritoMozo(this)">
                                                            <i class="fa fa-plus me-1"></i> Pedir
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="tab-pane fade" th:each="c : ${categorias}" th:id="'cat-' + ${c.id}" role="tabpanel">
                                <div class="row">
                                    <div class="col-md-6 mb-3" th:each="p : ${productos}" th:if="${p.categoria != null && p.categoria.id == c.id}">
                                        <div class="card shadow-sm border-0 menu-item-card h-100">
                                            <div class="card-body p-3 d-flex align-items-center">
                                                <img th:src="${p.getListaImagenes() != null && !p.getListaImagenes().isEmpty()} ? @{'/uploads/productos/' + ${p.getListaImagenes().get(0)}} : @{/assets/images/product/1.webp}" 
                                                     class="rounded me-3" width="70" height="70" style="object-fit: cover;" />
                                                <div class="w-100">
                                                    <h6 class="fw-bold mb-0" th:text="${p.nombre}"></h6>
                                                    <small class="text-muted d-block" th:text="${p.presentacion != null ? p.presentacion.nombre : 'Porción'}"></small>
                                                    <div class="d-flex justify-content-between align-items-center mt-2">
                                                        <span class="fw-bold text-primary" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></span>
                                                        <button type="button" class="btn btn-primary btn-sm px-3"
                                                                th:data-id="${p.id}" th:data-nombre="${p.nombre}" th:data-precio="${p.precio}"
                                                                onclick="agregarAlCarritoMozo(this)">
                                                            <i class="fa fa-plus me-1"></i> Pedir
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="col-lg-5">
                        <form th:action="@{/mesas/pedido/confirmar}" method="POST" id="formConfirmarComanda">
                            <input type="hidden" name="mesaId" th:value="${mesa.id}" />
                            
                            <div class="card shadow-sm border-0 sticky-cart">
                                <div class="card-header bg-primary text-white py-3">
                                    <h5 class="card-title mb-0 fw-bold"><i class="fa fa-receipt me-1"></i> Comanda de Pedido</h5>
                                </div>
                                
                                <div class="card-body p-3 flex-grow-1" data-simplebar style="overflow-y: auto;">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Nombre del Cliente</label>
                                        <input type="text" name="nombreCliente" class="form-control" th:placeholder="'Mesa #' + ${mesa.numero}" />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Notas Especiales (Cocina)</label>
                                        <input type="text" name="notasAdicionales" class="form-control" placeholder="Ej: Full cremas, chicha al tiempo..." />
                                    </div>

                                    <h6 class="fw-bold border-bottom pb-2 mb-2">Productos Seleccionados</h6>
                                    
                                    <div id="cartItemsList" class="d-flex flex-column gap-2">
                                        </div>
                                    
                                    <div id="cartEmptyPlaceholder" class="text-center py-4 text-muted font-w500">
                                        <i class="fa fa-shopping-basket mb-2 d-block fs-3"></i>
                                        El pedido está vacío. Agrega platos del menú izquierdo.
                                    </div>
                                </div>

                                <div class="card-footer bg-light p-3 border-top-0">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <span class="fs-5 text-muted fw-semibold">Total a enviar:</span>
                                        <span class="fs-3 fw-bold text-danger" id="lblCartTotal">S/ 0.00</span>
                                    </div>
                                    <div id="hiddenInputsWrapper"></div>

                                    <button type="submit" class="btn btn-success w-100 text-white font-w600 py-2 fs-5 shadow-sm">
                                        <i class="fa fa-paper-plane me-1"></i> Realizar Pedido (Enviar a Cocina)
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
        <th:block th:replace="~{components/footer :: footer}"></th:block>
    </div>
    <th:block th:replace="~{components/scripts :: scripts}"></th:block>

    <script>
        let carritoMozoMemory = [];

        function agregarAlCarritoMozo(btn) {
            const id = btn.getAttribute('data-id');
            const nombre = btn.getAttribute('data-nombre');
            const precio = parseFloat(btn.getAttribute('data-precio'));

            const itemExistente = carritoMozoMemory.find(item => item.id === id);

            if (itemExistente) {
                itemExistente.cantidad++;
            } else {
                carritoMozoMemory.push({ id, nombre, precio, cantidad: 1 });
            }
            renderizarCarritoComanda();
        }

        function cambiarCantidadCarrito(id, delta) {
            const item = carritoMozoMemory.find(item => item.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    carritoMozoMemory = carritoMozoMemory.filter(i => i.id !== id);
                }
                renderizarCarritoComanda();
            }
        }

        function eliminarItemCarrito(id) {
            carritoMozoMemory = carritoMozoMemory.filter(i => i.id !== id);
            renderizarCarritoComanda();
        }

        function renderizarCarritoComanda() {
            const listContainer = document.getElementById('cartItemsList');
            const placeholder = document.getElementById('cartEmptyPlaceholder');
            const totalLabel = document.getElementById('lblCartTotal');
            const hiddenWrapper = document.getElementById('hiddenInputsWrapper');

            listContainer.innerHTML = "";
            hiddenWrapper.innerHTML = "";
            let totalAcumulado = 0.0;

            if (carritoMozoMemory.length === 0) {
                placeholder.classList.remove('d-none');
                totalLabel.innerText = "S/ 0.00";
                return;
            }

            placeholder.classList.add('d-none');

            carritoMozoMemory.forEach(item => {
                const subtotalItem = item.precio * item.cantidad;
                totalAcumulado += subtotalItem;

                // 1. Crear fila UI de la comanda
                const row = document.createElement('div');
                row.className = "d-flex justify-content-between align-items-center p-2 rounded border bg-white shadow-2xs";
                row.innerHTML = `
                    <div style="flex: 1;">
                        <span class="fw-bold text-dark d-block text-1xs">${item.nombre}</span>
                        <small class="text-muted">S/ ${item.precio.toFixed(2)} c/u</small>
                    </div>
                    <div class="d-flex align-items-center me-3">
                        <button type="button" class="btn btn-outline-secondary btn-xs p-0 font-weight-bold rounded" style="width:22px; height:22px;" onclick="cambiarCantidadCarrito('${item.id}', -1)">-</button>
                        <span class="mx-2 font-w600 text-dark">${item.cantidad}</span>
                        <button type="button" class="btn btn-outline-secondary btn-xs p-0 font-weight-bold rounded" style="width:22px; height:22px;" onclick="cambiarCantidadCarrito('${item.id}', 1)">+</button>
                    </div>
                    <div class="text-end" style="width: 80px;">
                        <span class="fw-bold text-danger text-1xs d-block">S/ ${subtotalItem.toFixed(2)}</span>
                        <a href="javascript:void(0)" class="text-muted text-2xs" onclick="eliminarItemCarrito('${item.id}')"><i class="fa fa-trash-alt text-danger"></i></a>
                    </div>
                `;
                listContainer.appendChild(row);

                // 2. Inyectar los inputs ocultos indexados para la sincronización nativa de Spring
                hiddenWrapper.innerHTML += `<input type="hidden" name="productoIds" value="${item.id}" />`;
                hiddenWrapper.innerHTML += `<input type="hidden" name="cantidades" value="${item.cantidad}" />`;
            });

            totalLabel.innerText = "S/ " + totalAcumulado.toFixed(2);
        }

        // Intercepta el submit para validar que el mozo no envíe una comanda vacía
        document.getElementById('formConfirmarComanda').addEventListener('submit', function(e) {
            if (carritoMozoMemory.length === 0) {
                e.preventDefault();
                alert("Operación inválida: El pedido debe contener al menos un platillo del menú antes de ser enviado a cocina.");
            }
        });
    </script>
</body>
</html>
