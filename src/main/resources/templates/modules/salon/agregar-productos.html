<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/head :: head}"></th:block>
    <title th:text="${titulo}">Adición de Comanda | Pollería Latina</title>
</head>

<body>
    <div class="page-layout">
        <th:block th:replace="~{components/header :: header}"></th:block>
        <th:block th:replace="~{components/sidebar :: sidebar}"></th:block>

        <main class="app-wrapper">
            <div class="container-fluid">
                
                <div class="d-flex justify-content-between align-items-center mb-4 mt-2 border-bottom pb-3">
                    <div>
                        <h1 class="h3 mb-0 fw-bold" th:text="'Adicionar a Orden #' + ${pedido.id}">Adición</h1>
                        <p class="text-muted mb-0" th:text="'Cliente actual: ' + ${pedido.nombreCliente}"></p>
                    </div>
                    <div>
                        <a th:href="@{/mesas}" class="btn btn-outline-danger btn-sm font-w600">
                            <i class="fa fa-arrow-left me-1"></i> Regresar al Salón
                        </a>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 mb-3">
                            <div class="card-body p-3">
                                <h5 class="fw-bold text-primary mb-3">Menú de la Pollería</h5>
                                <div class="table-responsive" style="max-height: 500px;" data-simplebar>
                                    <table class="table table-sm align-middle">
                                        <tbody>
                                            <tr th:each="p : ${productos}">
                                                <td>
                                                    <span class="fw-bold d-block" th:text="${p.nombre}"></span>
                                                    <small class="text-muted" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></small>
                                                </td>
                                                <td class="text-end">
                                                    <form th:action="@{/mesas/agregar-producto}" method="POST" class="d-flex justify-content-end align-items-center gap-1">
                                                        <input type="hidden" name="pedidoId" th:value="${pedido.id}" />
                                                        <input type="hidden" name="productoId" th:value="${p.id}" />
                                                        <input type="number" name="cantidad" value="1" min="1" class="form-control form-control-sm" style="width: 60px;" required />
                                                        <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i></button>
                                                    </form>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-secondary text-white py-3">
                                <h5 class="card-title mb-0 fw-bold"><i class="fa fa-receipt me-1"></i> Estado de Cuenta Actual</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive border rounded mb-3">
                                    <table class="table table-hover table-sm mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Item</th>
                                                <th class="text-center">Cant.</th>
                                                <th class="text-end">Subtotal</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="d : ${pedido.detalles}">
                                                <td th:text="${d.producto.nombre}"></td>
                                                <td class="text-center" th:text="${d.cantidad}"></td>
                                                <td class="text-end fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="d-flex justify-content-between align-items-center p-3 rounded border bg-warning-subtle">
                                    <span class="fs-5 fw-bold text-dark">Monto Total Acumulado:</span>
                                    <span class="fs-3 fw-bold text-danger" th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ 0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <th:block th:replace="~{components/scripts :: scripts}"></th:block>
</body>
</html>
