<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/head :: head}"></th:block>
    <title th:text="${titulo}">Presentaciones | Pollería Latina</title>
</head>
<body>
    <div class="page-layout">
        <th:block th:replace="~{components/header :: header}"></th:block>
        <th:block th:replace="~{components/sidebar :: sidebar}"></th:block>

        <main class="app-wrapper">
            <div class="container-fluid">
                
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                    <div>
                        <h1 class="h3 mb-0 fw-bold" th:text="${titulo}">Gestión de Presentaciones</h1>
                        <p class="text-muted mb-0">Formatos y porciones de venta (Ej: 1/4 Pollo, 1/2 Pollo, Familiar, Jarra)</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalPresentacion" onclick="limpiarFormPresentacion()">
                            <i class="fa fa-plus-circle me-1"></i> Nueva Presentación
                        </button>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 80px;">ID</th>
                                        <th>Nombre del Formato</th>
                                        <th>Estado</th>
                                        <th class="text-center" style="width: 140px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(presentaciones)}">
                                        <td colspan="4" class="text-center text-muted py-4">No hay formatos de presentación registrados.</td>
                                    </tr>
                                    <tr th:each="pres : ${presentaciones}">
                                        <td th:text="${pres.id}"></td>
                                        <td class="fw-bold" th:text="${pres.nombre}"></td>
                                        <td>
                                            <span th:if="${pres.activo}" class="badge bg-success">Activo</span>
                                            <span th:unless="${pres.activo}" class="badge bg-secondary">Inactivo</span>
                                        </td>
                                        <td class="text-center">
                                            <div class="d-flex justify-content-center align-items-center">
                                                <button type="button" class="btn btn-primary shadow btn-xs sharp me-1 text-white"
                                                        th:data-id="${pres.id}"
                                                        th:data-nombre="${pres.nombre}"
                                                        onclick="cargarEditarPresentacion(this)">
                                                    <i class="fa fa-pencil-alt fa-sm"></i>
                                                </button>
                                                <a th:href="@{/presentaciones/eliminar/{id}(id=${pres.id})}" 
                                                   class="btn btn-danger shadow btn-xs sharp text-white"
                                                   onclick="return confirm('¿Deseas dar de baja este formato de venta del catálogo?');">
                                                    <i class="fa fa-trash fa-sm"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="modal fade" id="modalPresentacion" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title fw-bold" id="modalPresentacionTitle">Registrar Formato</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form th:action="@{/presentaciones/guardar}" th:object="${presentacion}" method="POST" id="formPresentacion">
                                <input type="hidden" th:field="*{id}" id="presId" />
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Nombre de la Presentación <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{nombre}" id="presNombre" class="form-control font-w500" required placeholder="Ej: 1/4 Pollo, 1/2 Pollo, Familiar" />
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-danger light" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar Presentación</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </main>
        <th:block th:replace="~{components/footer :: footer}"></th:block>
    </div>
    <th:block th:replace="~{components/scripts :: scripts}"></th:block>

    <script>
        function cargarEditarPresentacion(btn) {
            document.getElementById('modalPresentacionTitle').innerText = "Actualizar Formato de Venta";
            document.getElementById('presId').value = btn.getAttribute('data-id');
            document.getElementById('presNombre').value = btn.getAttribute('data-nombre');
            const modal = new bootstrap.Modal(document.getElementById('modalPresentacion'));
            modal.show();
        }
        function limpiarFormPresentacion() {
            document.getElementById('modalPresentacionTitle').innerText = "Registrar Formato";
            document.getElementById('formPresentacion').reset();
            document.getElementById('presId').value = "";
        }
    </script>
</body>
</html>
