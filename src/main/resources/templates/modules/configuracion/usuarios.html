<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <th:block th:replace="~{components/head :: head}"></th:block>
    <title>Usuarios del Sistema | Pollería Latina</title>
  </head>

  <body>
    <div class="page-layout">
      <th:block th:replace="~{components/header :: header}"></th:block>
      <th:block th:replace="~{components/sidebar :: sidebar}"></th:block>

      <main class="app-wrapper">
        <div class="container-fluid pt-4">
          <div
            th:if="${success}"
            class="alert alert-success alert-dismissible fade show shadow-sm"
            role="alert"
          >
            <i class="fi fi-rr-check-circle me-1"></i>
            <span th:text="${success}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>
          <div
            th:if="${error}"
            class="alert alert-danger alert-dismissible fade show shadow-sm"
            role="alert"
          >
            <i class="fi fi-rr-triangle-warning me-1"></i>
            <span th:text="${error}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <div class="card shadow-sm border-0">
            <div
              class="card-header border-bottom d-flex justify-content-between align-items-center py-3"
            >
              <h5 class="mb-0 fw-bold text-dark" th:text="${titulo}">
                Gestión de Usuarios
              </h5>
              <a
                sec:authorize="hasAuthority('USUARIOS_CREAR')"
                th:href="@{/usuarios/nuevo}"
                class="btn btn-primary"
              >
                <i class="fi fi-rr-plus me-1"></i> Nuevo Usuario
              </a>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th class="text-muted">Username</th>
                      <th class="text-muted">Nombre Completo</th>
                      <th class="text-muted">DNI</th>
                      <th class="text-muted">Rol</th>
                      <th class="text-muted">Estado</th>
                      <th class="text-center text-muted">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="u : ${usuarios}">
                      <td class="fw-bold text-dark" th:text="${u.username}">
                        admin
                      </td>
                      <td>
                        <div class="d-flex align-items-center">
                          <div
                            class="avatar avatar-sm rounded-circle bg-primary-subtle text-primary me-2 d-flex justify-content-center align-items-center fw-bold"
                            th:text="${#strings.substring(u.nombre, 0, 1)}"
                          >
                            A
                          </div>
                          <span th:text="${u.nombre + ' ' + u.apellidos}"
                            >Juan Perez</span
                          >
                        </div>
                      </td>
                      <td class="text-secondary" th:text="${u.dni}">
                        12345678
                      </td>
                      <td>
                        <span
                          class="badge bg-dark rounded-pill"
                          th:if="${u.rol.nombre == 'ADMIN'}"
                          ><i class="fi fi-rr-crown me-1"></i> ADMIN</span
                        >
                        <span
                          class="badge bg-secondary rounded-pill"
                          th:unless="${u.rol.nombre == 'ADMIN'}"
                          th:text="${u.rol.nombre}"
                          >CAJERO</span
                        >
                      </td>
                      <td>
                        <span
                          th:if="${u.activo}"
                          class="badge bg-success-subtle text-success px-2 py-1 rounded-pill"
                          >Activo</span
                        >
                        <span
                          th:unless="${u.activo}"
                          class="badge bg-danger-subtle text-danger px-2 py-1 rounded-pill"
                          >Inactivo</span
                        >
                      </td>
                      <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                          <a
                            sec:authorize="hasAuthority('USUARIOS_EDITAR')"
                            th:href="@{/usuarios/editar/} + ${u.id}"
                            class="btn btn-sm btn-action-gray rounded-circle"
                            title="Editar"
                          >
                            <i class="fi fi-rr-edit text-primary"></i>
                          </a>

                          <!-- Ocultamos apagar o borrar si es el ADMIN principal o el usuario actual -->
                          <th:block
                            th:if="${u.rol.nombre != 'ADMIN' and u.username != #authentication.name}"
                          >
                            <a
                              sec:authorize="hasAuthority('USUARIOS_EDITAR')"
                              th:href="@{/usuarios/estado/} + ${u.id}"
                              class="btn btn-sm btn-action-gray rounded-circle"
                              title="Cambiar Estado"
                            >
                              <i class="fi fi-rr-power text-warning"></i>
                            </a>
                            <a
                              sec:authorize="hasAuthority('USUARIOS_ELIMINAR')"
                              th:href="@{/usuarios/eliminar/} + ${u.id}"
                              class="btn btn-sm btn-action-gray rounded-circle"
                              title="Eliminar"
                              onclick="
                                return confirm(
                                  '¿Estás seguro de eliminar este usuario?',
                                );
                              "
                            >
                              <i class="fi fi-rr-trash text-danger"></i>
                            </a>
                          </th:block>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <th:block th:replace="~{components/scripts :: scripts}"></th:block>
  </body>
</html>
